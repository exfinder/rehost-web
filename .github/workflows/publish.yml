name: publish

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: The linux-x64 run whose candidate artifact is published
        required: true
      tag:
        description: Release tag, v and the candidate's version, for example v0.1.0-alpha.42
        required: true
      dry_run:
        description: Verify the candidate and stop before pushing or tagging
        type: boolean
        default: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  publish:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.302'
      - name: Download the candidate
        run: gh run download "${{ inputs.run_id }}" -n candidate -D candidate
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Resolve the candidate commit
        id: candidate
        run: |
          sha=$(gh run view "${{ inputs.run_id }}" --json headSha --jq .headSha)
          echo "candidate ${{ inputs.run_id }} was built from $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify the candidate
        run: |
          cd candidate
          sha256sum -c SHA256SUMS
          version="${{ inputs.tag }}"; version="${version#v}"
          ls Rehost.*."$version".nupkg | wc -l | grep -qx 11 || { echo "expected eleven packages at $version"; ls; exit 1; }
          grep -q "^# $version" ../docs/dev/releases/"$version".md || { echo "docs/dev/releases/$version.md does not start with # $version"; exit 1; }
      - name: Stop before publishing (dry run)
        if: inputs.dry_run
        run: 'echo "dry run: candidate ${{ inputs.run_id }} verified for ${{ inputs.tag }}; nothing pushed"'
      - name: Push to nuget.org
        if: ${{ !inputs.dry_run }}
        run: |
          dotnet nuget push "candidate/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      - name: Tag and create the prerelease
        if: ${{ !inputs.dry_run }}
        run: |
          version="${{ inputs.tag }}"; version="${version#v}"
          gh release create "${{ inputs.tag }}" --prerelease --target "${{ steps.candidate.outputs.sha }}" \
            --title "${{ inputs.tag }}" --notes-file "docs/dev/releases/$version.md" \
            candidate/*.nupkg candidate/*.snupkg candidate/SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
